name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.15.2

jobs:
  native:
    name: native (glibc, system libcurl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - run: make -j"$(nproc)"
      - run: make test
      - name: Check CHANGELOG.md has a section for this version
        run: sh scripts/release-notes.sh > /dev/null

  # Static musl builds, one per CPU floor. See scripts/build-static.sh for what each one targets.
  static:
    name: static ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [x86_64, i686-sse2, i686, i486]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.name }}
      - name: Install qemu-user and rpmbuild
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user rpm
      # The script rebuilds the libraries itself when the restored ones were built with other versions or flags.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/beige-static/${{ matrix.name }}/deps
          key: deps-${{ matrix.name }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('install.sh', 'scripts/build-static.sh') }}
          restore-keys: deps-${{ matrix.name }}-zig${{ env.ZIG_VERSION }}-
      - run: sh scripts/build-static.sh build ${{ matrix.name }}
      - run: sh scripts/build-static.sh check ${{ matrix.name }}
      - run: sh scripts/build-static.sh packages ${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: beige-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # Each binary inside an old distribution, and the .deb or .rpm installed there with that distribution's
  # dpkg or rpm. The containers share the runner's current kernel, so this covers the old userland, not
  # an old kernel.
  oldroot:
    name: ${{ matrix.image }} (${{ matrix.build }})
    needs: static
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: x86_64, image: 'centos:5', platform: linux/amd64 }
          - { build: x86_64, image: 'debian/eol:etch', platform: linux/amd64 }
          - { build: i686-sse2, image: 'centos:6', platform: linux/386 }
          - { build: i486, image: 'centos:6', platform: linux/386 }
          - { build: i686, image: 'debian/eol:lenny', platform: linux/386 }
          # Sarge had no official amd64 port; its amd64-tagged image holds an i386 userland.
          - { build: i486, image: 'debian/eol:sarge', platform: linux/amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: beige-${{ matrix.build }}
          path: dist
      - run: sh scripts/build-static.sh smoke ${{ matrix.build }} '${{ matrix.image }}' ${{ matrix.platform }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, static, oldroot]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: beige-*
          merge-multiple: true
          path: dist
      - name: Check the tag against BEIGE_VERSION
        run: ls dist/beige-"${GITHUB_REF_NAME#v}"-linux-*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          cd dist
          sha256sum -- *.tar.gz *.deb *.rpm > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "beige ${GITHUB_REF_NAME#v}" --notes-file ../notes.md *.tar.gz *.deb *.rpm SHA256SUMS
